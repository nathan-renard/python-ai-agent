name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs uv; uv then fetches the Python version pinned in .python-version
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      - name: Type check
        run: uv run --with mypy==2.4.1 mypy --strict main.py call_function.py config.py prompts.py

      # The OpenRouter client is mocked in the tests, so no API key is needed.
      # Every suite runs even if an earlier one fails, then the job fails if any did.
      - name: Run test suites
        run: |
          rc=0
          for t in test_*.py; do
            echo "::group::$t"
            uv run python "$t" || rc=1
            echo "::endgroup::"
          done
          exit $rc
